[project]
name = "alphadata"
version = "0.1.0"
description = "Tầng data cho Alpha research agent: crawl, chuẩn hoá, point-in-time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "duckdb>=1.1",
    "filelock>=3.16",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
]

[project.scripts]
alphadata = "alphadata.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.26.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src"]
# tests/*/conftest.py trùng tên: map theo đường dẫn (tests.metadata.conftest, ...).
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not live"]
markers = [
    "live: gọi nguồn thật qua mạng; không chạy trong CI (chạy tay: pytest -m live)",
]

[tool.coverage.run]
source = ["alphadata"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
